spring:
  application:
    name: hirematch-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/hirematch}
    username: ${SPRING_DATASOURCE_USERNAME:hirematch_user}
    password: ${SPRING_DATASOURCE_PASSWORD:changeme}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

management:
  endpoints:
    web:
      base-path: /api/v1/actuator
      exposure:
        include: health,info,metrics

logging:
  level:
    com.hirematch: DEBUG
    org.springframework.security: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# App-specific config
app:
  jwt:
    secret: ${JWT_SECRET:please-change-this-secret-to-at-least-64-chars-in-production!!}
    expiry-ms: ${JWT_EXPIRY_MS:900000}
    refresh-expiry-ms: ${JWT_REFRESH_EXPIRY_MS:604800000}

  storage:
    type: ${STORAGE_TYPE:local}
    path: ${STORAGE_PATH:./uploads}
    s3:
      bucket: ${AWS_S3_BUCKET:}
      region: ${AWS_S3_REGION:ap-south-1}

  ai-service:
    url: ${AI_SERVICE_URL:http://localhost:8000}

  rate-limit:
    capacity: ${RATE_LIMIT_CAPACITY:100}
    refill-tokens: ${RATE_LIMIT_REFILL_TOKENS:100}
    refill-period-seconds: ${RATE_LIMIT_REFILL_PERIOD_SECONDS:60}

  matching:
    weights:
      semantic: ${MATCH_WEIGHT_SEMANTIC:0.50}
      skill: ${MATCH_WEIGHT_SKILL:0.30}
      experience: ${MATCH_WEIGHT_EXPERIENCE:0.10}
      location: ${MATCH_WEIGHT_LOCATION:0.10}

  job-providers:
    adzuna:
      app-id: ${ADZUNA_APP_ID:}
      app-key: ${ADZUNA_APP_KEY:}
    jsearch:
      api-key: ${JSEARCH_API_KEY:}
    remotive:
      enabled: ${REMOTIVE_ENABLED:true}

  cors:
    allowed-origins:
      - http://localhost:3000
      - http://localhost:5173
      - https://ai-job-matcher-frontend-puce.vercel.app
      - https://ai-job-matcher-frontend-git-feature-a4a1aa-rohith-s-s-projects.vercel.app

springdoc:
  api-docs:
    path: /api/v1/api-docs
  swagger-ui:
    path: /api/v1/swagger-ui.html
    operations-sorter: method
